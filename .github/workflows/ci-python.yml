name: CI (Python)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff
        run: uv run --all-packages ruff check .

      - name: Pytest
        # One pytest process per member: several members share test file
        # basenames (test_app.py, test_config.py, ...), which collide in
        # sys.modules inside a single cross-package pytest run.
        run: |
          set -euo pipefail
          for m in packages/eye-client services/twin apps/api; do
            echo "==> pytest $m"
            uv run --directory "$m" pytest
          done
