name: Boundaries

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-boundaries:
    name: Check component boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make boundaries
        run: make boundaries
