name: Stale Issues & PRs

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days unless it is updated.
            If this issue is still relevant, please leave a comment or remove the stale label.
          close-issue-message: >
            This issue was closed automatically after 14 days of inactivity.
            Feel free to reopen it if it is still relevant.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "status:approved,status:in-progress,dependencies,good-first-issue"

          # Pull Requests
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days unless it is updated.
          close-pr-message: >
            This pull request was closed automatically after 7 days of inactivity.
            Feel free to reopen it when you are ready to continue.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "status:approved,status:in-progress,dependencies"

          operations-per-run: 100
