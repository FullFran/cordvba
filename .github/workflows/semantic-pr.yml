name: Semantic PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR title (Conventional Commit)
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scope-enum for Go backend services
          scopes: |
            api
            infra
            docs
            skills
            deps
            ci
            build
            audit
            governance
            lint
            release
          requireScope: false
          disallowScopes: ""
          subjectPattern: "^[a-z].+$"
          subjectPatternError: |
            The subject must start with a lowercase letter.
            Example: feat(api): add JWT refresh endpoint
          wip: true
