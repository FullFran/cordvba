name: Semantic PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # `wip: true` below makes the action post a commit status so the check can
  # stay pending while a title is marked WIP — v5 does this with
  # `POST /repos/:owner/:repo/statuses/:sha`. Without this it gets a 403 and
  # reports as a failed title check whatever the title says.
  statuses: write

jobs:
  semantic:
    name: Validate PR title (Conventional Commit)
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scope-enum for Go backend services
          # The domains this repository actually has. The boilerplate's list
          # named none of them, so every commit eye has ever made would have
          # been rejected by this check had it ever run.
          scopes: |
            cli
            source
            provider
            observation
            store
            scheduler
            config
            api
            render
            docs
            deps
            ci
            build
            release
            main
            eye
            web
            twin
            intelligence
            eye-client
            contracts
            evals
            infra
          requireScope: false
          disallowScopes: ""
          subjectPattern: "^[a-z].+$"
          subjectPatternError: |
            The subject must start with a lowercase letter.
            Example: feat(api): add JWT refresh endpoint
          wip: true
