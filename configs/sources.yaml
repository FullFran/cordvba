# eye — source registry
#
# This file is the legal and operational contract of the project. Nothing is
# fetched that is not declared here, and nothing is fetched automatically
# unless `automation: enabled`.
#
# access:
#   documented_api        published machine-readable contract (CKAN, DATEX II, GTFS-RT, REST)
#   documented_download   published file resource with stable terms
#   public_html           public page, no documented reuse contract
#   undocumented_backend  internal endpoint behind a public viewer — never automated
#
# automation:
#   enabled        the scheduler may poll it
#   review_terms   valuable, but reuse terms are unclear — held out until a human resolves it
#   manual_link    eye links to the viewer and ingests nothing
#   disabled       never fetched automatically
#
# interval        eye's engineering poll interval (our decision)
# published_every the refresh cadence the publisher declares (their decision)
#
# Polling faster than `published_every` buys nothing but rate limits.

sources:
  # ── Transport · roads ─────────────────────────────────────────────────────
  - id: dgt-incidents
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/es/dataset/incidencias-dgt-datex2-v3-7
    format: datex2-3.7-xml
    license: CC-BY-4.0
    access: documented_api
    automation: review_terms
    interval: 60s
    notes: >-
      Backbone of the road picture, but nap.dgt.es answers 403 to automated
      clients (verified 2026-08-28). Held until access is arranged; parse
      against the published XSD when it is.

  - id: dgt-cameras
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/datex2/v3/dgt/DevicePublication/camaras_datex2_v37.xml
    format: datex2-devices
    license: free-of-charge-nap-terms
    access: documented_api
    automation: enabled
    interval: 1h
    published_every: 1h
    notes: >-
      1948 cameras with id, position, road, kilometre point and province.
      Each carries an <fse:deviceUrl> pointing at a still JPEG on
      etraffic.dgt.es — verified 2026-08-28, image/jpeg 853x480.

      There is NO video: all 1948 devices are type "camera" with a single
      .jpg URL, and the feed contains no rtsp/rtmp/m3u8/mp4 at all. Images
      refresh every 5-20 minutes (one sampled camera was 53 days stale), so
      polling faster buys nothing.

      Two licences, do not conflate them: the DATEX II metadata is free of
      charge under the NAP dataset terms; the IMAGES are DGT portal content
      under its aviso legal, which permits reproduction only for personal
      and private use. eye may render a frame locally. eye serve must never
      proxy one.

  - id: dgt-vms
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/es/dataset/paneles-dgt-tiempo-real-datex2-v3-7
    format: datex2-3.7-xml
    license: CC-BY-4.0
    access: documented_api
    automation: review_terms
    interval: 60s
    notes: Held with the other DGT feeds; nap.dgt.es answers 403 to automated clients.

  # ── Transport · city ──────────────────────────────────────────────────────
  - id: cordoba-ckan
    authority: Ayuntamiento de Cordoba
    topic: city
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-catalog
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 12h
    options:
      rows: "50"
    notes: >-
      Generic CKAN adapter over the municipal catalog. Emits a record when a
      dataset is published or updated. Many datasets declare no licence; that
      is stored as "unspecified" and surfaced, never assumed to be permission.

  - id: cordoba-cameras
    authority: Ayuntamiento de Cordoba
    topic: transport
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-geojson
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 24h
    options:
      dataset: camaras-de-trafico
      kind: camera
    notes: >-
      Traffic camera INVENTORY as entities: 32 points in WGS84, with `name`
      and coordinates and nothing else.

      Audited 2026-08-28: the municipality publishes NO camera image, by any
      route. The same 32 points appear twice in the catalog (here and as a
      layer of `movilidad-cartografia`), both with only a `name` property.
      The mobility portal has no camera viewer, the municipal IDE GeoServer
      publishes 105 layers and none of them is cameras, and a search of all
      145 municipal datasets finds nothing with an image, video or webcam.

      WHY, and it is not an oversight: the municipality operates 80 cameras
      from the Traffic Control Room at the Local Police Headquarters — 46 for
      traffic management, 11 for ACIRE enforcement, the rest for bus lanes,
      traffic lights, the Mosque area and parking. These are operational and
      enforcement cameras, not an information service. DGT publishes stills
      because informing drivers IS its system's purpose; Cordoba's is to
      manage and to fine. Note also that only 32 of the 80 positions are
      published, so even this inventory is partial. See issue #58.

      The only public camera frames for Cordoba are DGT's, three of which sit
      within 40 km on the A-4.

  - id: aucorsa-gtfs
    authority: AUCORSA / NAP Transportes
    topic: transport
    url: https://nap.transportes.gob.es/Files/Detail/1375
    format: gtfs
    license: free-with-registration
    access: documented_download
    automation: review_terms
    interval: 24h
    published_every: 24h
    notes: Static GTFS only; no official GTFS-RT found. Download needs a NAP session, so ingestion is not yet unattended.

  # RENFE publishes its own open-data portal at data.renfe.com, which needs no
  # registration at all. The NAP entry that once made this source look
  # login-gated was simply the wrong route to it.
  - id: cordoba-bus
    authority: Ayuntamiento de Cordoba / AUCORSA
    topic: transport
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-geojson
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 168h
    options:
      dataset: movilidad-cartografia
      resource: Bus
      kind: bus
    notes: >-
      City bus stops and route geometry, from the municipal cartography
      dataset. 118 features, mixing stop points that carry a name and a
      direction with the line geometry of the routes — which is why the kind
      is "bus" rather than "bus_stop".

      The name field holds rendered HTML ("ACERA DE GUERRITA<br><br>DIRECCIÓN:
      CENTRO CIUDAD"), stripped by the shared mapper.

      Stops and routes only. AUCORSA publishes no timetable and no real-time
      arrivals as open data; its app reads an undocumented backend at
      lightapi.aucorsa.es, which is a separate decision under ADR-0008.

  - id: renfe-cordoba-departures
    authority: RENFE
    topic: transport
    url: https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip
    format: gtfs
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 6h
    published_every: 24h
    options:
      kind: station
      stops: "50500,50417,50413,50501,50502,50504,37704"
    notes: >-
      Published departures from Córdoba's seven stations, including the C-1:
      Córdoba-Julio Anguita (50500), Campus Universitario de Rabanales
      (50417), Alcolea de Córdoba, El Higuerón, Villarrubia de Córdoba,
      Posadas and Villanueva de Córdoba.

      These stops live in the AV/LD/MD feed, not in RENFE's Cercanías one,
      which despite its name contains no Córdoba stop at all.

      Timetable, not real time. RENFE's GTFS-Realtime feeds cover other
      núcleos: a check of every stop id in trip_updates found none of
      Córdoba's (verified 2026-08-28).

  - id: renfe-positions
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/vehicle_positions.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 60s
    published_every: 20s
    options:
      ttl: "24h"
    notes: >-
      Live train positions. GTFS-Realtime, published as JSON alongside the
      protobuf form — which is why eye reads it without adding a protobuf
      dependency. Verified 2026-08-28: 230 trains, updated every 20 seconds.

      CERCANÍAS ONLY. All three of RENFE's real-time datasets say so
      explicitly, and Córdoba has no Cercanías network: the nearest live
      train on this feed was 72 km away, on the Sevilla line. Córdoba is
      served by AV/LD/MD, for which RENFE publishes the timetable but not
      real-time. Kept for regional context, not for the city.

  - id: renfe-delays
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/trip_updates.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 60s
    published_every: 20s
    notes: >-
      Delays, cancellations, added services and stations out of service.
      Punctual trains are dropped by the adapter: reporting every on-time
      service would bury the late ones, which are the reason to read this.

  - id: renfe-alerts
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/alerts.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 5m
    notes: "Service alerts. Verified 2026-08-28: 74 active."

  # ── Air ───────────────────────────────────────────────────────────────────
  - id: adsb-lol
    authority: adsb.lol
    topic: air
    url: https://api.adsb.lol
    format: adsb-json
    license: check-terms-before-redistribution
    access: documented_api
    automation: enabled
    interval: 15s
    options:
      lat: "37.8882"
      lon: "-4.7794"
      radius_nm: "60"
      ttl: "72h"
    notes: >-
      Best ergonomics for a local viewport. Positions carry ExpiresAt: movement
      data is short-lived by design.

  - id: opensky
    authority: OpenSky Network
    topic: air
    url: https://opensky-network.org/api/states/all
    format: rest-json
    license: non-commercial-review-required
    access: documented_api
    automation: review_terms
    interval: 20s
    notes: >-
      OpenSky distinguishes personal from commercial use. Resolve the licence
      before this runs anywhere but a personal machine.

  # ── Environment ───────────────────────────────────────────────────────────
  - id: aemet-warnings
    authority: AEMET
    topic: weather
    url: https://opendata.aemet.es/
    format: rest-json-two-step
    license: reuse-with-attribution
    access: documented_api
    automation: enabled
    interval: 5m
    notes: Two-step API — the first response returns metadata plus a `datos` URL to fetch.

  - id: aemet-observation
    authority: AEMET
    topic: weather
    url: https://opendata.aemet.es/
    format: rest-json-two-step
    license: reuse-with-attribution
    access: documented_api
    automation: enabled
    interval: 10m

  - id: nasa-firms
    authority: NASA FIRMS
    topic: fire
    url: https://firms.modaps.eosdis.nasa.gov/api/area/
    format: rest-csv
    license: nasa-open-data
    access: documented_api
    automation: enabled
    interval: 10m
    notes: >-
      Latency is orbital, not network. Polling faster changes nothing. The FIRMS
      `confidence` field is product metadata and must not be copied into
      Record.Confidence.

  - id: infoca-risk
    authority: Junta de Andalucia / REDIAM
    topic: fire
    url: https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_Indice_Riesgo_Incendios_Diario
    format: wms
    license: check-layer-metadata
    access: documented_api
    automation: review_terms
    interval: 3h
    published_every: 24h

  - id: infoca-active
    authority: Junta de Andalucia
    topic: fire
    url: https://www.juntadeandalucia.es/organismos/ema/areas/incendios-forestales/
    format: web-viewer
    license: unspecified
    access: public_html
    automation: manual_link
    notes: Real-time viewer with no documented machine interface. eye links to it and ingests nothing.

  - id: saih-guadalquivir
    authority: Confederacion Hidrografica del Guadalquivir
    topic: hydrology
    url: https://www.chguadalquivir.es/saih/
    format: web
    license: unspecified
    access: public_html
    automation: review_terms
    interval: 5m
    notes: >-
      High value, fragile integration. The publisher states its automatic
      readings are NOT cross-checked; that warning must reach the UI as
      quality=preliminary.

  - id: miteco-ica
    authority: MITECO
    topic: air_quality
    url: https://catalogo.datosabiertos.miteco.gob.es/
    format: csv-dcat
    license: check-distribution
    access: documented_api
    automation: enabled
    interval: 20m
    published_every: 1h

  - id: ign-seismic
    authority: Instituto Geografico Nacional
    topic: geophysics
    url: https://www.ign.es/ign/RssTools/sismologia.xml
    format: rss
    license: official-cite-ign
    access: documented_api
    automation: enabled
    interval: 5m
    notes: >-
      The catalog page is HTML, but IGN also publishes the last 20 events as
      RSS with geo:lat/geo:long. Verified 2026-08-28.

  - id: edistribucion-outages
    authority: e-distribucion
    topic: energy
    url: https://www.edistribucion.com/es/servicios/cortes-averias.html
    format: web-map
    license: unspecified
    access: undocumented_backend
    automation: manual_link
    notes: Public map, private backend. Never scraped.

  # ── Events ────────────────────────────────────────────────────────────────
  - id: uco-events
    authority: Universidad de Cordoba
    topic: events
    url: https://eventos.uco.es/rss/next.rss
    format: rss
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 6h
    notes: >-
      The events portal publishes RSS, KML and ICS explicitly — the only
      Cordoba event source with a real machine contract. In this feed pubDate
      is the EVENT START, not the publication moment, so it is mapped to
      ValidFrom.

  - id: agenda-unica
    authority: Ayuntamiento de Cordoba
    topic: events
    url: https://agendaunica.cordoba.es/
    format: html
    license: unspecified
    access: public_html
    automation: review_terms
    interval: 6h
    notes: Broadest municipal coverage. Needs a licence answer before unattended ingestion.

  - id: turismo-cordoba
    authority: Turismo de Cordoba
    topic: events
    url: https://www.turismodecordoba.org/agenda
    format: html
    license: unspecified
    access: public_html
    automation: review_terms
    interval: 12h

  - id: imae-teatro
    authority: IMAE / Teatro Cordoba
    topic: press
    url: https://teatrocordoba.es/feed/
    format: rss
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 6h
    notes: >-
      The venue's announcement feed, NOT its schedule: pubDate is when the
      article was written, not when the show starts. Filed under press for
      exactly that reason — treating it as an event source would date every
      concert on the day it was announced.

      The schedule lives at /wp-json/wp/v2/ajde_events, a documented WordPress
      REST collection. That needs its own adapter. Verified 2026-08-28.

  # ── Cordoba spatial data infrastructure (IDE) ─────────────────────────────
  # https://ide.cordoba.es/geoserver — municipal WFS, 105 layers, no key.
  # Verified 2026-08-28. The server declares no reuse licence, so every layer
  # starts held; the adapter works and the question is legal, not technical.
  - id: cordoba-patios
    authority: Ayuntamiento de Cordoba (IDE)
    topic: events
    url: https://ide.cordoba.es/geoserver/ows
    format: wfs-geojson
    license: unspecified
    access: documented_api
    automation: review_terms
    interval: 168h
    options:
      layer: idecordoba:patios_21
      kind: patio
    notes: >-
      HOLD REASON IS NOT TECHNICAL. This layer publishes the NAME, TELEPHONE
      NUMBER and EMAIL ADDRESS of the person responsible for each courtyard —
      real contact details for private citizens, in an open WFS. eye drops
      those fields unconditionally at the mapper (see the personalProperties
      list in internal/provider/infrastructure/geojson), but the Ayuntamiento
      should be told: publishing them is very unlikely to be deliberate.

      The Patios competition, geolocated. Seven editions are published —
      patios_2015, patios_2016, patios_2017, patios_18, patios_19, patios_20,
      patios_21 — plus 75 per-route layers by neighbourhood (Realejo, San
      Lorenzo, Santiago, Juderia, Alcazar Viejo, Santa Marina, San Basilio,
      Regina) and the fuera-de-concurso entries.

      Each feature carries an address, an itinerary code and a point. This is
      the substrate the events domain needs for May: what is where, on which
      route, in which year.

  - id: cordoba-zonas-verdes
    authority: Ayuntamiento de Cordoba (IDE)
    topic: city
    url: https://ide.cordoba.es/geoserver/ows
    format: wfs-geojson
    license: unspecified
    access: documented_api
    automation: review_terms
    interval: 168h
    options:
      layer: idecordoba:zonas_verdes
      kind: green_space

  - id: cordoba-colegios
    authority: Ayuntamiento de Cordoba (IDE)
    topic: city
    url: https://ide.cordoba.es/geoserver/ows
    format: wfs-geojson
    license: unspecified
    access: documented_api
    automation: review_terms
    interval: 168h
    options:
      layer: idecordoba:colegios
      kind: school

  - id: cordoba-arbolado
    authority: Ayuntamiento de Cordoba (IDE)
    topic: city
    url: https://ide.cordoba.es/geoserver/ows
    format: wfs-geojson
    license: unspecified
    access: documented_api
    automation: review_terms
    interval: 720h
    options:
      layer: idecordoba:Arbolado
      kind: tree
      count: "20000"
    notes: Street tree inventory. Large; relevant to heat and shade during the May festivities.

  # ── Local press ───────────────────────────────────────────────────────────
  # Newspapers are the source that catches what every official feed missed.
  # eye reads their public syndication feeds, which is what those feeds are for;
  # it does not scrape article bodies and does not republish their content.
  - id: diario-cordoba
    authority: Diario Cordoba
    topic: press
    url: https://www.diariocordoba.com/rss/
    format: rss
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 30m
    notes: Prensa Iberica. RSS 2.0, UTF-8, titles and links wrapped in CDATA.

  - id: cordopolis
    authority: Cordopolis (eldiario.es)
    topic: press
    url: https://cordopolis.eldiario.es/rss/
    format: rss
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 30m

  - id: eldiadecordoba
    authority: El Dia de Cordoba (Grupo Joly)
    topic: press
    url: https://www.eldiadecordoba.es/rss/
    format: rss
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 30m

  # ── Civic documents ───────────────────────────────────────────────────────
  - id: boe
    authority: Agencia Estatal BOE
    topic: civic
    url: https://www.boe.es/rss/boe.php
    format: rss
    license: aebo-reuse-terms
    access: documented_api
    automation: enabled
    interval: 1h
    notes: >-
      Served as ISO-8859-1. Decoding it as UTF-8 turns every accented word into
      a replacement character, so the charset is resolved before parsing.

  - id: bop-cordoba
    authority: Diputacion de Cordoba
    topic: civic
    url: https://bop.dipucordoba.es/
    format: html
    license: bop-legal-notice
    access: public_html
    automation: review_terms
    interval: 1h
    notes: Early signal for road closures, works and municipal authorisations.

  - id: placsp
    authority: Ministerio de Hacienda
    topic: civic
    url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
    format: rss
    license: open-data
    access: documented_api
    automation: enabled
    interval: 6h
    notes: >-
      Public procurement is how a large event leaves a trace months before it
      is announced. Served as a 10 MB Atom feed. Verified 2026-08-28.

  - id: dipucordoba-ckan
    authority: Diputacion de Cordoba
    topic: civic
    url: https://transparencia.dipucordoba.es/api-para-desarrolladores/
    format: ckan-api
    license: per-dataset
    access: documented_api
    automation: enabled
    interval: 24h
