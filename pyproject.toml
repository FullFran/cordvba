[project]
name = "cordvba-workspace"
version = "0.0.0"
description = "Root workspace for cordvba's Python components (eye-client, twin, api)."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/eye-client"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
