[project]
name = "api"
version = "0.1.0"
description = "The cordvba product backend: composes eye and twin into one representation for the web."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eye-client",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[tool.uv.sources]
eye-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# B008 (function call in a default argument) is how FastAPI's Depends()
# is meant to be used; flagging it here would be a permanent false positive.
extend-ignore = ["B008"]
