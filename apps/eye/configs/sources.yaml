# eye — source registry
#
# This file is the legal and operational contract of the project. Nothing is
# fetched that is not declared here, and nothing is fetched automatically
# unless `automation: enabled`.
#
# access:
#   documented_api        published machine-readable contract (CKAN, DATEX II, GTFS-RT, REST)
#   documented_download   published file resource with stable terms
#   public_html           public page, no documented reuse contract
#   undocumented_backend  internal endpoint behind a public viewer — never automated
#
# automation:
#   enabled        the scheduler may poll it
#   review_terms   valuable, but reuse terms are unclear — held out until a human resolves it
#   manual_link    eye links to the viewer and ingests nothing
#   disabled       never fetched automatically
#
# interval        eye's engineering poll interval (our decision)
# published_every the refresh cadence the publisher declares (their decision)
#
# Polling faster than `published_every` buys nothing but rate limits.

sources:
  # ── Transport · roads ─────────────────────────────────────────────────────
  - id: dgt-incidents
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v37.xml
    format: datex2-situations
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 5m
    published_every: 5m
    notes: >-
      Backbone of the road picture: incidents, roadworks and closures for the
      whole national network, including the A-4, A-45, N-432 and the rest of
      Córdoba's approaches.

      THE 403 IN THE PREVIOUS NOTE WAS ATTRIBUTED TO THE WRONG ENDPOINT, and
      this source sat held for it. Re-verified 2026-09-03: nap.dgt.es refuses
      only its CKAN discovery path (/api/3/action/package_show → 403). The
      published DATEX II data file is served openly to any client — 200,
      3,762,760 bytes, 578 <sit:situation> elements, publicationTime minutes
      old, and the answer is identical with a browser User-Agent, with eye's
      own, and with no User-Agent at all.

      The URL here is the DATA FILE, not the dataset landing page. That
      distinction is the whole difference between held and working.

      No geographic filter is applied at ingestion: DGT publishes Spain and
      eye filters at query time.

  - id: dgt-cameras
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/datex2/v3/dgt/DevicePublication/camaras_datex2_v37.xml
    format: datex2-devices
    license: free-of-charge-nap-terms
    access: documented_api
    automation: enabled
    interval: 1h
    published_every: 1h
    notes: >-
      1948 cameras with id, position, road, kilometre point and province.
      Each carries an <fse:deviceUrl> pointing at a still JPEG on
      etraffic.dgt.es — verified 2026-08-28, image/jpeg 853x480.

      There is NO video: all 1948 devices are type "camera" with a single
      .jpg URL, and the feed contains no rtsp/rtmp/m3u8/mp4 at all. Images
      refresh every 5-20 minutes (one sampled camera was 53 days stale), so
      polling faster buys nothing.

      Two licences, do not conflate them: the DATEX II metadata is free of
      charge under the NAP dataset terms; the IMAGES are DGT portal content
      under its aviso legal, which permits reproduction only for personal
      and private use. eye may render a frame locally. eye serve must never
      proxy one.

  - id: dgt-vms
    authority: Direccion General de Trafico
    topic: transport
    url: https://nap.dgt.es/datex2/v3/dgt/VmsPublication/datex2_v37.xml
    format: datex2-vms
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 5m
    published_every: 5m
    notes: >-
      What the motorway signs are actually displaying. Verified 2026-09-03:
      200, 3,062,527 bytes. Unblocked for the same reason as `dgt-incidents` —
      the 403 was on the CKAN path, never on the data.

      MIND THE SPELLING. The publisher's own dataset page links this resource
      as `VmsPublicaction`, which 404s. The correct path, and the one the XSD
      on that same page uses, is `VmsPublication`. Somebody will "fix" this
      URL back one day; this note is why they should not.

      A sign displaying nothing is not news, and the adapter drops it.

  # ── Transport · city ──────────────────────────────────────────────────────
  - id: cordoba-ckan
    authority: Ayuntamiento de Cordoba
    topic: city
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-catalog
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 12h
    options:
      rows: "50"
    notes: >-
      Generic CKAN adapter over the municipal catalog. Emits a record when a
      dataset is published or updated. Many datasets declare no licence; that
      is stored as "unspecified" and surfaced, never assumed to be permission.

  - id: cordoba-cameras
    authority: Ayuntamiento de Cordoba
    topic: transport
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-geojson
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 24h
    options:
      dataset: camaras-de-trafico
      kind: camera
    notes: >-
      Traffic camera INVENTORY as entities: 32 points in WGS84, with `name`
      and coordinates and nothing else.

      Audited 2026-08-28: the municipality publishes NO camera image, by any
      route. The same 32 points appear twice in the catalog (here and as a
      layer of `movilidad-cartografia`), both with only a `name` property.
      The mobility portal has no camera viewer, the municipal IDE GeoServer
      publishes 105 layers and none of them is cameras, and a search of all
      145 municipal datasets finds nothing with an image, video or webcam.

      WHY, and it is not an oversight: the municipality operates 80 cameras
      from the Traffic Control Room at the Local Police Headquarters — 46 for
      traffic management, 11 for ACIRE enforcement, the rest for bus lanes,
      traffic lights, the Mosque area and parking. These are operational and
      enforcement cameras, not an information service. DGT publishes stills
      because informing drivers IS its system's purpose; Cordoba's is to
      manage and to fine. Note also that only 32 of the 80 positions are
      published, so even this inventory is partial. See issue #58.

      The only public camera frames for Cordoba are DGT's, three of which sit
      within 40 km on the A-4.

  - id: aucorsa-gtfs
    authority: AUCORSA / NAP Transportes
    topic: transport
    url: https://nap.transportes.gob.es/Files/Detail/1375
    format: gtfs
    license: free-with-registration
    access: documented_download
    automation: review_terms
    interval: 24h
    published_every: 24h
    notes: >-
      HELD FOR TWO REASONS NOW, and the second one is worse than the first.

      Login: /Files/Download/1375 answers 405 and the page says "Inicia sesión
      para descargar". That was already known.

      EXPIRED: the NAP metadata for this feed reads "Rango de fechas
      24/2/2026 – 30/3/2026, actualizado el 25/2/2026". The service calendar
      ran out over five months ago. Even with credentials this GTFS would
      produce zero valid departures today, so arranging them buys nothing
      until AUCORSA republishes. Verified 2026-09-03.

      Worth recording that it EXISTS, though, because two other notes in this
      file used to say AUCORSA publishes no GTFS at all. It does: 37 routes,
      721 stops, validated without warnings. It is login-gated and stale, not
      absent.

  # RENFE publishes its own open-data portal at data.renfe.com, which needs no
  # registration at all. The NAP entry that once made this source look
  # login-gated was simply the wrong route to it.
  - id: aucorsa-arrivals
    authority: AUCORSA
    topic: transport
    url: https://lightapi.aucorsa.es/wp-json/aucorsa/v1
    format: aucorsa-arrivals
    license: unspecified
    access: undocumented_personal
    automation: enabled
    interval: 60s
    options:
      stops: "116,456,239,88,808"
      token_page: https://aucorsa.es/
    notes: >-
      Arrival estimates from AUCORSA's own REST namespace, which the operator
      publishes no documentation for. Two routes are read and no others:
      /estimations/stop for the next buses, and /autocompletion/stop to
      resolve a stop by name. UNDOCUMENTED_PERSONAL under ADR-0008:
      the registry alone cannot enable it, the machine must set
      EYE_ALLOW_PERSONAL_SOURCES, and its records never leave that machine
      through eye serve.

      The endpoint declines without the CSRF token that AUCORSA's public pages
      print for every visitor — verified 2026-08-28 that a browser and a plain
      HTTP GET of the same page receive the identical value, so it carries no
      account and identifies nobody. eye reads it from that page, caches it for
      six hours, and re-reads it when the endpoint declines.

      It answers 200 with the body "-1" when it refuses, so a status code is
      not enough to tell whether a poll worked.

      LOCKED OUT OF ITS OWN KEY, 2026-09-03. These two things are true at the
      same time: lightapi.aucorsa.es is UP — it answers 200 and lists its 20
      routes, though it takes about 20 seconds against eye's 30-second
      timeout — and this source still cannot poll, because the token above
      comes from aucorsa.es, whose origin has been refusing connections since
      30 August. /estimations/stop answers "-1" without it, and lightapi's own
      root 301-redirects to the dead host.

      So an arrivals failure here is worth reading carefully. "Token page
      unreachable" and "the arrivals endpoint refused" are different faults
      with different owners, and during this outage the first one is what is
      happening even though the second is what a casual glance would assume.

      Estimates are recorded as quality=preliminary: they are the operator's
      own prediction, not a measurement.

      stops are the numbers printed on the pole, which is what the endpoint
      expects. The operator's own web pages carry a second, unrelated number
      (a page identifier); configuring that one returns no arrivals and no
      error. Use `eye bus <name>` to look a stop up by name instead of
      guessing. The five here are central: Ronda Tejares (Cruz Conde),
      Claudio Marcelo (Tendillas), Paseo Victoria, Gran Capitan and Campus
      Rabanales.

  - id: aucorsa-lines
    authority: AUCORSA
    topic: transport
    url: https://aucorsa.es
    format: aucorsa-lines
    license: unspecified
    access: public_html
    automation: enabled
    interval: 168h
    notes: >-
      City bus lines, stops and service hours, read from the operator's own
      public line pages. Each page at /linea/{code}/ is server-rendered and
      carries every stop with its id and name plus the first and last service
      per day type.

      This note used to say AUCORSA publishes no GTFS. It does — see
      `aucorsa-gtfs` — but that feed is login-gated and its calendar expired
      in March 2026, so these pages remain the only current source of a
      Córdoba city timetable.

      OUTAGE. Last successful poll 2026-08-30 14:18 UTC; still down when
      re-probed 2026-09-03 08:30 UTC, so roughly four days and counting.

      The origin is what is dead, and only the origin. aucorsa.es and
      www.aucorsa.es both resolve to 18.101.44.203 (AWS eu-south-2) and to
      2a05:d011:d2e:e700::/64, and TCP 443 and 80 refuse on BOTH families.
      No alternative host exists: CTAN's operator record for AUCORSA declares
      no URL, and the municipal mobility page links none.

      MIND WHICH NUMBER YOU READ when this happens again. `eye sources` shows
      LAST OK, which is the age of the last SUCCESS. A dashboard showing the
      last ATTEMPT will read a few hours old however long the outage has run,
      because eye keeps trying. The two are different questions and only one
      of them is "how long has this been broken".

      WHAT STILL WORKS. The 32 lines and 690 stops from the last good poll are
      in the store and keep being served, stamped with their real age. A
      timetable four days old is worth more than no timetable, as long as
      nobody is told it is fresh.

      Ordinary public HTML, fetched the way a browser fetches it. The pages
      carry no coordinates; the municipal cartography layer does, and matching
      the two is its own piece of work rather than a guess.

  - id: cordoba-bus
    authority: Ayuntamiento de Cordoba / AUCORSA
    topic: transport
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-geojson
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 168h
    options:
      dataset: movilidad-cartografia
      resource: Bus
      kind: bus
    notes: >-
      City bus stops and route geometry, from the municipal cartography
      dataset. 118 features, mixing stop points that carry a name and a
      direction with the line geometry of the routes — which is why the kind
      is "bus" rather than "bus_stop".

      The name field holds rendered HTML ("ACERA DE GUERRITA<br><br>DIRECCIÓN:
      CENTRO CIUDAD"), stripped by the shared mapper.

      Stops and routes only, and mostly routes: of the 118 features, all but
      a handful are line geometry titled "Line". This layer cannot tell you
      where a named stop is, which is why `osm-bus-stops` exists.

      AUCORSA publishes no real-time arrivals as open data; its app reads an
      undocumented backend at lightapi.aucorsa.es, which is a separate
      decision under ADR-0008. Its GTFS timetable does exist through NAP, but
      login-gated and expired — see `aucorsa-gtfs`.

  - id: ctan-cordoba
    authority: Consorcio de Transporte Metropolitano del Area de Cordoba
    topic: transport
    url: https://api.ctan.es/v1/datos/UNIFICADO/gtfs.zip
    format: gtfs
    license: reuse-authorised-ley-37-2007
    access: documented_download
    automation: enabled
    interval: 12h
    published_every: 24h
    options:
      kind: station
      stops: "8_99,8_126"
    notes: >-
      Metropolitan buses between Córdoba and its province: 11 lines, 131 stops,
      operators including AUCORSA. Verified 2026-09-03 — every file in the zip
      was rebuilt at 00:10 that morning, and the portal states the data is
      rebuilt daily.

      THE BEST LICENCE IN THIS REGISTRY, and the reason this entry is enabled
      while several municipal ones are not. api.ctan.es/avisolegal.html grants
      reuse explicitly under Ley 37/2007, for commercial AND non-commercial
      purposes, worldwide and free of charge, on two conditions: do not distort
      the meaning of the data, and cite "Información obtenida a través del
      Portal de Datos Abiertos de la Red de Consorcios de Transporte de
      Andalucía" with the date of retrieval.

      Consortium 8 is Córdoba. Consortium 7 is Jaén — the portal's own table
      is the documentation, and there is no index endpoint (/v1/Consorcios
      is a 404), so this is worth writing down before somebody guesses again.

      stops are the two consortium-8 stops inside the city: 8_99 Estación de
      Autobuses de Córdoba, where every metropolitan line terminates, and
      8_126 Campus Universitario de Rabanales. The other 129 are out in the
      province. The feed is the whole Andalusian network — 5026 stops across
      nine consortia — so asking for everything would bury Córdoba in it.

      This is the timetable. CTAN also publishes a full REST API with live
      service notices; see `ctan-cordoba-notices`.

  - id: ctan-cordoba-notices
    authority: Consorcio de Transporte Metropolitano del Area de Cordoba
    topic: transport
