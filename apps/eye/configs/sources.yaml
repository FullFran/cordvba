  # ── Environment ───────────────────────────────────────────────────────────
  - id: aemet-warnings
    authority: AEMET. Agencia Estatal de Meteorologia
    topic: weather
    url: https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-spain
    format: meteoalarm-atom
    license: cc-by-4.0-equivalent-meteoalarm-terms
    access: documented_api
    automation: enabled
    interval: 15m
    published_every: 15m
    options:
      zones: "ES078,ES079,ES080"
    notes: >-
      Meteorological warnings for Cordoba province, as CAP 1.2 carried on
      AEMET's whole-of-Spain MeteoAlarm Atom feed. NO CREDENTIAL NEEDED.

      WHY NOT AEMET'"'"'S OWN API. AEMET publishes these through opendata.aemet.es,
      which requires a JWT obtained by email registration. A source that only
      works with the operator'"'"'s own credential is one nobody else running eye
      can reproduce, and reproducibility is the value ADR-0008 exists to
      protect. MeteoAlarm — the EUMETNET early-warning service — relays the
      same warnings with no key at all. AEMET'"'"'s own warnings API is also no
      finer-grained: `area` selects a whole autonomous community (Andalucia is
      "61", eight provinces), never a province, so it buys nothing here that
      MeteoAlarm does not already carry.

      IT IS STILL AEMET SPEAKING, and that is checkable rather than assumed:
      the CAP document behind each entry carries
      sender: http://www.aemet.es and
      senderName: "AEMET. Agencia Estatal de Meteorología". Verified 2026-09-03.
      The relay is recorded on every record — provenance points at the
      MeteoAlarm URL, because that is what eye actually fetched, and the
      payload keeps `issuing_authority` and `relayed_by` as the two separate
      facts they are.

      LICENCE, from the feed'"'"'s own <rights> element: "Copyright © 2026
      MeteoAlarm.Org. Licensed under terms equivalent to CC BY 4.0, with
      additional requirements for redistributing outlined in our Terms and
      Conditions." The redistribution caveat is real and is recorded here
      rather than rounded down to "CC BY".

      SCOPED TO CORDOBA BY EMMA_ID (issue #142). This feed had been ingesting
      warnings for the whole country: live records on 2026-09-26 included
      "Llanada alavesa" and "Rioja alavesa", nowhere near Cordoba. AEMET'"'"'s CAP
      documents give each zone a stable EMMA_ID geocode that survives a
      description being renamed, unlike the area name itself. Cordoba
      province is exactly three AEMET zones, confirmed from the recorded CAP
      fixtures in testdata/aemet/cap and the MeteoAlarm fixture in
      testdata/meteoalarm: ES078 Sierra y Pedroches (AEMET zone 611401), ES079
      Campiña cordobesa (611402) and ES080 Subbética cordobesa (611403). The
      `zones` option already existed as an opt-in filter, matched by EMMA_ID or
      by a folded substring of the area name; this registry entry is what
      turns it on, the same shape as `province: "14"` on miteco-ica (#98).

      This narrows at ingestion, unlike `dgt-incidents`: that feed has no
      stable per-item geocode to filter on, so dropping anything there risks
      losing a renamed zone for good. AEMET'"'"'s EMMA_ID is exactly the stable
      key that makes narrowing safe here instead.

      Setting AEMET_API_KEY still works: change the format back to
      rest-json-two-step with options {product: warnings, area: "61"} and eye
      reads AEMET directly, still for the whole of Andalucia — the `zones`
      option is MeteoAlarm-specific and would need re-narrowing downstream.

  - id: metar-cordoba
    authority: NOAA Aviation Weather Center
    topic: weather
    url: https://aviationweather.gov/api/data/metar
    format: metar-json
    license: us-government-public-domain
    access: documented_api
    automation: enabled
    retention: historical
    interval: 20m
    published_every: 30m
    sampled_kinds: [weather_observation]
    options:
      stations: LEBA
      kind: weather_station
    notes: >-
      Live surface weather for Córdoba, with no credential. LEBA is the ICAO
      identifier of Córdoba Airport. Verified 2026-09-03: 23 °C, dew point 12,
      wind 360° at 3 kt, QNH 1019, reported at 00:00Z and received at 00:05Z.

      THIS IS THE SAME PHYSICAL STATION AEMET PUBLISHES AS 5402, reported
      through a different channel, and the differences matter more than the
      similarity:

        · The publisher is NOAA, not AEMET. NOAA is not the competent
          meteorological authority for Spain, so this is stored as
          quality=preliminary and never as an official declaration. Every
          record carries a payload note saying so.
        · METAR is written for pilots. It reports temperature, dew point,
          wind, visibility, cloud and pressure — not the fuller variable set
          AEMET publishes.
        · The cadence is the aerodrome's, roughly half-hourly.

      It exists because until it did, eye knew nothing at all about the
      weather outside: `aemet-observation` has never once run, because it
      needs a key nobody had set. A reading from the right instrument under
      the wrong letterhead, clearly labelled, beats no reading.

      Licence: works of the US federal government are in the public domain.
      Attribution is courtesy rather than obligation, and eye records the
      publisher anyway.

      sampled_kinds: a surface reading is a sample of a moving signal, not a
      statement. Diffing two of them would report the weather back as news.

  - id: aemet-observation
    authority: AEMET
    topic: weather
    url: https://opendata.aemet.es/
    format: rest-json-two-step
    license: reuse-with-attribution
    access: documented_api
    automation: enabled
    retention: historical
    interval: 10m
    options:
      product: observation
      station: "5402"
    notes: >-
      Automatic station readings. 5402 is Córdoba Aeropuerto.

      Needs the same AEMET_API_KEY, with the same two-step behaviour as
      `aemet-warnings`.

      Recorded as quality=preliminary, deliberately. These are automatic
      readings the publisher has not reviewed, and a temperature that turns
      out to be a sensor fault is still not an official statement. The
      distinction has to survive all the way to the display.

  - id: nasa-firms
    authority: NASA FIRMS
    topic: fire
    url: https://firms.modaps.eosdis.nasa.gov/api/area/
    format: rest-csv
    license: nasa-open-data
    access: documented_api
    automation: enabled
    interval: 10m
    options:
      archive: https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_Europe_24h.csv
      bbox: "-5.8,37.2,-4.0,38.8"
      source: VIIRS_SNPP_NRT
      days: "1"
    notes: >-
      Active-fire detections over Córdoba province and its approaches.

      NO CREDENTIAL NEEDED, and that is a deliberate choice between two things
      NASA publishes. The area API filters server-side and requires a personal
      FIRMS_MAP_KEY; the NRT archive named in `archive` is a plain CSV that
      requires none. Verified 2026-09-03: HTTP 200, 180 KB, 2,239 detections
      across Europe, 6 of them inside this bounding box, newest acquisition the
      same day.

      The archive wins because a source that only works with the operator's own
      credential is one nobody else running eye can reproduce, and
      reproducibility is the value ADR-0008 was written to protect. Setting
      FIRMS_MAP_KEY still works: remove `archive` and the adapter goes back to
      the area API, which is narrower and fresher.

      THE ARCHIVE IS CONTINENTAL, so the bounding box is applied by the adapter
      rather than by NASA. Without that filter this source would quietly store
      fires in Poland under a Córdoba heading. bbox is required, never
      defaulted: the alternative to a bounding box here is the whole continent.

      When a key IS configured, it travels in the URL PATH, which FIRMS chose
      and eye has to live with. Since a failed fetch quotes the URL into an
      error and errors are persisted as source health, the adapter redacts it
      to [MAP_KEY] before it can reach the store.

      Latency is orbital, not network. Polling faster changes nothing. The
      FIRMS `confidence` field is product metadata and must not be copied into
      Record.Confidence.

