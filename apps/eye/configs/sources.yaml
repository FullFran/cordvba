  # ── Cordoba spatial data infrastructure (IDE) ─────────────────────────────
  # https://ide.cordoba.es/geoserver — municipal WFS, 105 layers, no key.
  # Verified 2026-08-28. The server declares no reuse licence, so every layer
  # starts held; the adapter works and the question is legal, not technical.
  - id: cordoba-patios
    authority: Ayuntamiento de Cordoba (IDE)
    topic: events
    url: https://ide.cordoba.es/geoserver/ows
    format: wfs-geojson
    license: unspecified
    access: documented_api
    automation: review_terms
    interval: 168h
    options:
      layer: idecordoba:patios_21
      kind: patio
    notes: >-
      HOLD REASON IS NOT TECHNICAL. This layer publishes the NAME, TELEPHONE
      NUMBER and EMAIL ADDRESS of the person responsible for each courtyard —
      real contact details for private citizens, in an open WFS. eye drops
      those fields unconditionally at the mapper (see the personalProperties
      list in internal/provider/infrastructure/geojson), but the Ayuntamiento
      should be told: publishing them is very unlikely to be deliberate.

      The Patios competition, geolocated. Seven editions are published —
      patios_2015, patios_2016, patios_2017, patios_18, patios_19, patios_20,
      patios_21 — plus 75 per-route layers by neighbourhood (Realejo, San
      Lorenzo, Santiago, Juderia, Alcazar Viejo, Santa Marina, San Basilio,
      Regina) and the fuera-de-concurso entries.

      Each feature carries an address, an itinerary code and a point. This is
      the substrate the events domain needs for May: what is where, on which
      route, in which year.

