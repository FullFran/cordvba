    notes: >-
      The catalog page is HTML, but IGN also publishes the last 20 events as
      RSS with geo:lat/geo:long. Verified 2026-08-28.

      kind and severity are set here rather than left to the RSS adapter's
      defaults. A feed is a transport, not a subject: without `kind` these
      earthquakes are stored as "news_item" and are invisible to anything
      looking for seismic events, and without `severity` a magnitude 5.0 ranks
      exactly as high as a press headline. `severity: magnitude` reads the
      figure out of IGN's own sentence ("terremoto de magnitud 3.1") and is
      opt-in for that reason — it must never be applied to a feed whose numbers
      are not magnitudes.

