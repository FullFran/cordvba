      Same reuse authorisation as `ctan-cordoba`. Attribution is a condition,
      not a courtesy, so the licence travels on every record.

  - id: ctan-cordoba-stops
    authority: Consorcio de Transporte Metropolitano del Area de Cordoba
    topic: transport
    url: https://api.ctan.es/v1/Consorcios/8/paradas?lang=ES
    format: ctan-stops
    license: reuse-authorised-ley-37-2007
    access: documented_api
    automation: enabled
    interval: 168h
    options:
      kind: bus_stop
    notes: >-
      78 metropolitan stops WITH COORDINATES, plus fare zone, locality and
      municipality. The consortium publishes what AUCORSA does not.

      These are the province's stops, not the city's — the two Córdoba-city
      entries are the bus station and Rabanales. For city stop coordinates see
      `osm-bus-stops`, which is a different publisher under a different
      licence, and is kept separate for that reason.

  - id: osm-bus-stops
    authority: OpenStreetMap contributors
    topic: transport
    url: https://overpass-api.de/api/interpreter
    format: overpass-json
    license: ODbL-1.0
    access: documented_api
    automation: enabled
    interval: 168h
    published_every: 24h
    options:
      kind: bus_stop
      bbox: "37.80,-4.90,37.98,-4.65"
      query: |
        (
          node["highway"="bus_stop"]({{bbox}});
          node["public_transport"="platform"]["bus"="yes"]({{bbox}});
        );
    notes: >-
      Bus stop COORDINATES, which no other source in this registry has.

      The gap this fills, measured 2026-09-03: AUCORSA publishes 690 stops with
      names and pole numbers and not one coordinate, because its line pages
      carry none. The municipal cartography layer publishes 118 features that
      are almost entirely route geometry, with a handful of named stops. So
      until now eye could tell you when your bus arrives and not where to stand.

      This query returns 473 stops inside the bounding box, 454 of them named.

      NO MATCHING IS DONE, and that is a decision rather than an omission.
      Folding abbreviations matches 305 of AUCORSA's 690 names exactly (44%),
      and a token-overlap threshold would take it to about 57% — which means
      roughly one in ten "matches" would be a guess. eye does not publish a
      guessed coordinate under a publisher's name. The two inventories sit side
      by side, each with its own provenance, and a person reading either can see
      which one they are looking at.

      BOUNDING BOX, NOT AREA NAME. An `area["name"="Córdoba"]` query returns
      6,125 stops because it also matches Córdoba, Argentina — verified, the
      results span latitude -31.5 to 37.99. The box is the city and its ring.

      ODbL is share-alike. Attribution is required wherever these coordinates
      are shown, and anything redistributed that is derived from them carries
      the same licence. That is why the licence travels on every entity rather
      than living in a footnote.

  # The `movilidad-cartografia` dataset publishes 33 resources, 28 of them
  # GeoJSON, and until 2026-09-03 this registry read exactly one of them. Every
  # entry below is the SAME dataset, the same publisher and the same terms as
  # `cordoba-bus` above, read by the same adapter with a different `resource`.
  # No new code, and they are what turns a map of nothing into a map of the
  # city's kerbside.
  #
  # Licence is "unspecified" for all of them, exactly as for `cordoba-bus` and
  # `cordoba-cameras`. That is a fact recorded, never a permission assumed.
  - id: cordoba-parking
    authority: Ayuntamiento de Cordoba
    topic: transport
    url: https://datosabiertos.cordoba.es/ckan
    format: ckan-geojson
    license: unspecified
    access: documented_api
    automation: enabled
    interval: 168h
    options:
      dataset: movilidad-cartografia
      resource: Parking
      kind: parking
    notes: >-
      The nine public car parks, as static inventory. Verified 2026-09-03:
      there is NO occupancy field, and no occupancy source exists anywhere in
      the municipal catalogue. eye can say where to park, not whether there is
      space, and must not imply otherwise.

