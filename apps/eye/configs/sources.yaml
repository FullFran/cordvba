  - id: miteco-ica
    authority: MITECO
    topic: air_quality
    url: https://ica.miteco.es/datos/ica-ultima-hora.csv
    format: csv-dcat
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    retention: historical
    interval: 20m
    published_every: 1h
    options:
      distribution: https://ica.miteco.es/datos/ica-ultima-hora.csv
      province: "14"
    notes: >-
      The national air-quality index, hourly, per station. 624 rows nationally,
      narrowed here to Córdoba province (INE code 14) by station code, not by
      bounding box: a bounding box tight enough to hold Córdoba city also holds
      Puertollano (Ciudad Real) and the Sierra Norte of Sevilla, which a box
      cannot tell apart from a real province boundary.

      6 Córdoba-province stations are returned: 14021006 ASOMADILLA, 14021007
      LEPANTO and 14021009 AVDA. AL-NASIR in the city, plus 14026002 POBLADO,
      14047001 OBEJO and 14068001 VILLAHARTA. The bbox this replaced also
      picked up 6 Puertollano stations and 1 Sevilla station — see issue #98.

      TLS: THIS HOST SERVES AN INCOMPLETE CHAIN. The root CA (AC RAIZ FNMT-RCM)
      is publicly trusted and the intermediate (AC Componentes Informáticos) is
      simply absent from the handshake. Go does not chase AIA, so it cannot
      complete the chain by itself, and the poll fails with "certificate signed
      by unknown authority" against a certificate that is perfectly valid.

      THE FIX, verified 2026-09-03:

        curl -o /tmp/accomp.crt http://www.cert.fnmt.es/certs/ACCOMP.crt
        openssl x509 -inform DER -in /tmp/accomp.crt \
          -out ~/.config/eye/fnmt-intermediate.pem
        export EYE_EXTRA_CA_FILE=~/.config/eye/fnmt-intermediate.pem

      That COMPLETES a chain. It is the opposite of disabling verification,
      which eye does not offer and will not grow: every certificate is still
      checked, against a pool the operator widened on purpose, one named file
      at a time.

      TWO CAVEATS THE PUBLISHER'S OWN DICTIONARY STATES, both preserved. An
      index computed from fewer pollutants than the full set is published as
      the same category multiplied by ten (10, 20 … 60) — same rank, but
      recorded as quality=preliminary rather than official. And 63 of the 624
      rows carry a BLANK index, which the dictionary does not explain at all;
      those stations are kept with index_reported:false instead of being
      quietly dropped.

  - id: ign-seismic
