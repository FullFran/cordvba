  - id: renfe-cordoba-departures
    authority: RENFE
    topic: transport
    url: https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip
    format: gtfs
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 6h
    published_every: 24h
    options:
      kind: station
      stops: "50500,50417,50413,50501,50502,50504,37704"
    notes: >-
      Published departures from Córdoba's seven stations, including the C-1:
      Córdoba-Julio Anguita (50500), Campus Universitario de Rabanales
      (50417), Alcolea de Córdoba, El Higuerón, Villarrubia de Córdoba,
      Posadas and Villanueva de Córdoba.

      These stops live in the AV/LD/MD feed, not in RENFE's Cercanías one,
      which despite its name contains no Córdoba stop at all.

      Timetable, not real time. RENFE's GTFS-Realtime feeds cover other
      núcleos: a check of every stop id in trip_updates found none of
      Córdoba's (verified 2026-08-28).

  - id: renfe-positions
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/vehicle_positions.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 60s
    published_every: 20s
    sampled_kinds: [vehicle_position]
    options:
      ttl: "24h"
    notes: >-
      Live train positions. GTFS-Realtime, published as JSON alongside the
      protobuf form — which is why eye reads it without adding a protobuf
      dependency. Verified 2026-08-28: 230 trains, updated every 20 seconds.

      sampled_kinds: a train position is a sample, not a statement. Every
      train moves between polls, so diffing them reports the reading back as
      news. Trip delays from the same publisher are statements and stay
      watched.

      CERCANÍAS ONLY, and Córdoba has no Cercanías network: the nearest
      live train on this feed was 72 km away, on the Sevilla line. Kept for
      regional context, not for the city.

      CORRECTION 2026-09-03: this note used to end "RENFE publishes the
      timetable but not real-time" for AV/LD/MD. That was wrong. RENFE's own
      CKAN carries `posicion-vehiculos-av-ld-md` and
      `horarios-viaje-alta-velocidad-larga-media-distancia`, both CC-BY-4.0
      and both refreshed every minute. They are now declared as
      `renfe-positions-ld` and `renfe-delays-ld`, and for this city they
      matter more than this entry does.

      Also worth knowing for anyone reading an empty poll: this feed returns
      85 bytes and zero entities overnight, because Cercanías does not run.
      An empty answer here is the network sleeping, not the adapter failing.

  - id: renfe-delays
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/trip_updates.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 60s
    published_every: 20s
    notes: >-
      Delays, cancellations, added services and stations out of service.
      Punctual trains are dropped by the adapter: reporting every on-time
      service would bury the late ones, which are the reason to read this.

  # RENFE publishes real time for AV/LD/MD too. The three feeds above are the
  # Cercanías ones, and Córdoba has no Cercanías network — which is why the
  # entries below matter more to this city than the ones above it.
  - id: renfe-positions-ld
    authority: RENFE
    topic: transport
    url: https://gtfsrt.renfe.com/vehicle_positions_LD.json
    format: gtfs-rt-json
    license: CC-BY-4.0
    access: documented_api
    automation: enabled
    interval: 60s
    published_every: 60s
    sampled_kinds: [vehicle_position]
    options:
      ttl: "24h"
    notes: >-
      Live positions for Alta Velocidad, Larga Distancia and Media Distancia —
      the network that actually serves Córdoba.

      This CORRECTS the note on `renfe-positions`, which said RENFE publishes
      no real time for AV/LD/MD. It does. The dataset is
      `posicion-vehiculos-av-ld-md` in RENFE's own CKAN, declared
      Creative Commons Attribution 4.0, and the JSON resource was last
      refreshed 2026-09-03T00:01 when this entry was added — one minute
      before it was read.

      Same GTFS-Realtime JSON envelope as the Cercanías feeds, so no new
      adapter. Honest caveat about what was actually observed: at 00:38 the
      whole national feed carried one vehicle and twelve trip updates, so a
      Córdoba train was NOT seen in it. What is verified is that the feed
      exists, is licensed, and is current. Whether Córdoba services appear
      needs a daytime look.

      sampled_kinds for the same reason as the Cercanías feed: a position is
      a sample of a moving signal, and diffing it reports the reading back
      as news.

