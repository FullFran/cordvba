server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path serves index.html, so client-side
    # routing (and a hard refresh on a deep link) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No secrets here: the API base URL is baked in at build time via
    # VITE_API_BASE_URL and served as plain static JS.
}
