# infra/compose/compose.yml — the cordvba v0.1 MVP stack behind one edge.
#
# Brings up twin, api and web next to eye, which already runs on this host
# as its own compose project (container names eye-daemon, eye-api; see
# apps/eye/deploy/docker-compose.yml). eye is never joined to this project
# and never rebuilt here — twin and api reach it by service name over its
# own network, given below as the external "eye" network.
#
# Only the edge publishes a port, and only on loopback: everything else is
# reachable solely through this project's own "default" network, or, for
# twin and api, the external "eye" network. Publication to the internet is
# the operator's job (Tailscale Funnel) — see infra/deployment/README.md.
#
#   cp .env.example .env    # then fill it in, see infra/deployment/README.md
#   docker compose -p cordvba-mvp -f infra/compose/compose.yml up -d --build
#
# Build contexts are the repository root for every image below, because the
# Python services share the uv workspace (packages/eye-client) and the web
# image needs packages/contracts/environment/v1.

name: cordvba-mvp

services:
  twin:
    build:
      context: ../..
      dockerfile: services/twin/Dockerfile
    restart: unless-stopped
    environment:
      EYE_BASE_URL: ${EYE_BASE_URL:-http://eye-api:8787}
      EYE_API_TOKEN: ${EYE_API_TOKEN:?EYE_API_TOKEN is required — see infra/deployment/README.md}
    networks:
      - default
      - eye
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      EYE_BASE_URL: ${EYE_BASE_URL:-http://eye-api:8787}
      EYE_API_TOKEN: ${EYE_API_TOKEN:?EYE_API_TOKEN is required — see infra/deployment/README.md}
      TWIN_BASE_URL: http://twin:8100
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
    networks:
      - default
      - eye
    depends_on:
      twin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    # nginx's master process (root) chowns its temp dirs to the nginx user
    # and forks workers under it at startup, so it keeps CHOWN/SETUID/SETGID
    # rather than dropping every capability.
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Loopback only. The operator points Tailscale Funnel at this port;
      # see infra/deployment/README.md. Do not change this to publish on
      # every interface.
      - "127.0.0.1:${EDGE_PORT:-8088}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - default
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    # The caddy binary carries a NET_BIND_SERVICE file capability, so
    # dropping every capability makes the kernel refuse to exec it at all;
    # keep only that one back. /config is scratch (autosave state) and can
    # be tmpfs; /data is a named volume in case a future Caddyfile adds TLS
    # state that should survive a restart.
    tmpfs:
      - /tmp
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default: {}
  eye:
    name: ${EYE_NETWORK:-cordvba-eye_default}
    external: true

volumes:
  caddy-data:
