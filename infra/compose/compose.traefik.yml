# Optional overlay: publishes the edge on a public host name through an
# existing Traefik that watches Docker labels on the `dokploy-network` network
# (the VPS's Dokploy Traefik). Traefik terminates TLS with its Let's Encrypt
# resolver; the edge itself stays plain HTTP on port 8080.
#
# Why: the Tailscale Funnel host name resolves to a private tailnet address on
# devices that are members of the tailnet, and browsers block a public page
# (GitHub Pages) from calling a private address. A public host name works for
# everyone. See infra/deployment/README.md and issue #120.
#
#   docker compose -p cordvba-mvp -f compose.yml -f compose.traefik.yml up -d
#
# Requires CORDVBA_PUBLIC_HOST (for example cordvba.<your-domain>) with a DNS
# record pointing at the host.

services:
  edge:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-dokploy-network}
      traefik.http.services.cordvba-edge.loadbalancer.server.port: "8080"
      traefik.http.routers.cordvba.rule: Host(`${CORDVBA_PUBLIC_HOST:?set CORDVBA_PUBLIC_HOST, e.g. cordvba.example.com}`)
      traefik.http.routers.cordvba.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.cordvba.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.cordvba.service: cordvba-edge
      traefik.http.routers.cordvba-http.rule: Host(`${CORDVBA_PUBLIC_HOST}`)
      traefik.http.routers.cordvba-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.cordvba-http.middlewares: ${TRAEFIK_REDIRECT_MIDDLEWARE:-redirect-to-https@file}
      traefik.http.routers.cordvba-http.service: cordvba-edge

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
